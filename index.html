<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棉品库存（测试版）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
  
  .header { text-align: center; margin-bottom: 24px; }
  .header h2 { font-size: 28px; color: #333; }
  
  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .filter-btn { padding: 8px 20px; border: 1px solid #2ea660; background: #fff; color: #2ea660; border-radius: 20px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
  .filter-btn.active, .filter-btn:hover { background: #2ea660; color: #fff; }
  
  /* 搜索栏 */
  .search-bar { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .search-bar input { width: 90%; max-width: 360px; padding: 10px 16px; font-size: 15px; border: 1px solid #ddd; border-radius: 24px; outline: none; box-shadow: 0 2px 6px rgba(0,0,0,0.06); transition: border-color 0.2s; }
  .search-bar input:focus { border-color: #2ea660; box-shadow: 0 2px 8px rgba(46,166,96,0.2); }
  .search-bar .clear-btn { padding: 8px 16px; border: 1px solid #ccc; background: #fff; color: #666; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
  .search-bar .clear-btn:hover { background: #ff6b6b; color: #fff; border-color: #ff6b6b; }
  .search-result-hint { text-align: center; color: #999; font-size: 13px; margin-bottom: 12px; }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
  .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s; }
  .card:hover { transform: translateY(-4px); }
  .img-wrap { width: 100%; height: 220px; background: #eee; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .img-wrap img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
  .img-wrap span { color: #999; font-size: 14px; }
  .card-info { padding: 12px; }
  .name { font-weight: bold; font-size: 15px; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .sku { color: #666; }
  .stock { font-weight: bold; }
  .stock.ok { color: #2ea660; }
  .stock.low { color: #ff6b6b; }
  
  .pagination { text-align: center; margin-top: 24px; }
  .page-btn { padding: 6px 12px; margin: 0 4px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; }
  .page-btn.active { background: #2ea660; color: #fff; border-color: #2ea660; }
  .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .loading { text-align: center; padding: 40px; color: #999; }
  
  /* 大图弹窗 */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
  .modal.active { display: flex; }
  .modal img { max-width: 90%; max-height: 75vh; object-fit: contain; border-radius: 8px; cursor: default; }
  .modal-info { color: #fff; margin-top: 16px; text-align: center; font-size: 16px; }
  .modal-info div { margin: 4px 0; }
  .modal-stock { font-weight: bold; }
  .close-btn { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 36px; cursor: pointer; opacity: 0.7; }
  .close-btn:hover { opacity: 1; }
  
  /* 无结果 */
  .no-result { text-align: center; padding: 60px 20px; color: #999; font-size: 16px; }
</style>
</head>
<body>

<div class="header">
  <h2>📦 棉品库存（测试版）</h2>
</div>

<div class="filter-bar" id="filterBar"></div>

<!-- 搜索栏 -->
<div class="search-bar">
  <input type="text" id="searchInput" placeholder="搜索货号或商品名称..." oninput="filterCards()" />
  <button class="clear-btn" onclick="clearSearch()">清除</button>
</div>
<div class="search-result-hint" id="searchHint"></div>

<div class="loading" id="loading">加载中...</div>
<div class="grid" id="grid"></div>
<div class="pagination" id="pagination"></div>

<div class="modal" id="modal" onclick="closeModal()">
  <span class="close-btn" onclick="closeModal()">&times;</span>
  <img id="modalImg" src="" onclick="event.stopPropagation()">
  <div class="modal-info">
    <div id="modalName"></div>
    <div id="modalSku"></div>
    <div id="modalStock" class="modal-stock"></div>
  </div>
</div>

<script>
// ================= 配置区 =================
const brands = ['茉纸26秋冬', '兰朵儿26秋冬', '洹乐熊26秋冬', '钓鱼猫26秋冬', '贝婴兔26秋冬', '班纳日记26秋冬', '婴装26秋冬', '叮当町26秋冬', '小米班长26秋冬', '青禾小筑26秋冬', '丛林木马26秋冬', '米兰贝贝26秋冬', '椰奶小贝26秋冬', '沐童王子26秋冬', '英贝米尼26秋季', '贝肽斯26秋冬', '贝婴兔福利款'];
// =================

const PAGE_SIZE = 24;
let currentBrand = 'all';
let allDataCache = [];
let currentRenderData = [];
let currentPage = 1;
let searchKeyword = '';

function init() {
  renderFilterButtons();
  loadBrand('all');
}

function renderFilterButtons() {
  const bar = document.getElementById('filterBar');
  let html = `<button class="filter-btn active" onclick="loadBrand('all', this)">全部</button>`;
  brands.forEach(b => {
    html += `<button class="filter-btn" onclick="loadBrand('${b.replace(/'/g,"\\'")}', this)">${b}</button>`;
  });
  bar.innerHTML = html;
}

function loadBrand(brand, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  
  currentBrand = brand;
  currentPage = 1;
  searchKeyword = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchHint').textContent = '';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('grid').innerHTML = '';

  if (brand === 'all') {
    Promise.all(brands.map(b => 
      fetch(`brands/${b}/data.json`)
        .then(res => res.json())
        .then(data => data.map(row => ({...row, _brand: b})))
        .catch(() => [])
    )).then(results => {
      allDataCache = results.flat();
      currentRenderData = allDataCache;
      document.getElementById('loading').style.display = 'none';
      renderPage();
    });
  } else {
    fetch(`brands/${brand}/data.json`)
      .then(res => {
        if (!res.ok) throw new Error('找不到 data.json');
        return res.json();
      })
      .then(data => {
        allDataCache = data.map(row => ({...row, _brand: brand}));
        currentRenderData = allDataCache;
        document.getElementById('loading').style.display = 'none';
        renderPage();
      })
      .catch(err => {
        document.getElementById('loading').textContent = '加载失败：' + err.message;
      });
  }
}

// ========== 搜索功能 ==========
function filterCards() {
  const input = document.getElementById('searchInput');
  searchKeyword = input.value.trim().toLowerCase();
  
  if (!searchKeyword) {
    // 无搜索词，恢复全部数据
    currentRenderData = allDataCache;
    currentPage = 1;
    document.getElementById('searchHint').textContent = '';
    renderPage();
    return;
  }
  
  // 从 allDataCache 中过滤
  currentRenderData = allDataCache.filter(row => {
    const name = (row['商品名称'] || row['name'] || '').toString().toLowerCase();
    const sku = (row['货号'] || row['sku'] || '').toString().toLowerCase();
    return name.includes(searchKeyword) || sku.includes(searchKeyword);
  });
  
  currentPage = 1;
  
  // 显示搜索结果提示
  const hint = document.getElementById('searchHint');
  if (currentRenderData.length === 0) {
    hint.textContent = `未找到包含"${input.value}"的商品`;
  } else {
    hint.textContent = `找到 ${currentRenderData.length} 个结果`;
  }
  
  renderPage();
}

function clearSearch() {
  searchKeyword = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchHint').textContent = '';
  currentRenderData = allDataCache;
  currentPage = 1;
  renderPage();
}

// 回车触发搜索
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        filterCards();
      }
    });
  }
});

function renderPage() {
  const grid = document.getElementById('grid');
  const start = (currentPage - 1) * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  const pageData = currentRenderData.slice(start, end);

  if (pageData.length === 0) {
    grid.innerHTML = '<div class="no-result">暂无匹配商品</div>';
    renderPagination();
    return;
  }

  grid.innerHTML = pageData.map((row, index) => {
    const name = row['商品名称'] || row['name'] || '';
    const sku = row['货号'] || row['sku'] || '';
    const stock = row['库存'] || row['stock'] || 0;
    const imgName = row['图片名'] || row['image'] || '';
    const brand = row._brand || currentBrand;
    
    const imgPath = `brands/${brand}/${imgName}`;
    const wrapId = 'wrap-' + index;
    const safeName = (name || '').toString().replace(/'/g, "\\'");
    const safeSku = (sku || '').toString().replace(/'/g, "\\'");
    
    return `
      <div class="card">
        <div class="img-wrap" id="${wrapId}">
          <img src="${imgPath}" 
               onclick="showBig('${imgPath.replace(/'/g,"\\'")}','${safeName}','${safeSku}',${stock})" 
               onerror="this.onerror=function(){handleImgErr('${wrapId}')};">
        </div>
        <div class="card-info">
          <div class="name">${name || sku}</div>
          <div class="detail">
            <span class="sku">${sku}</span>
            <span class="stock ${stock > 5 ? 'ok' : 'low'}">库存: ${stock}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');

  renderPagination();
}

function handleImgErr(id) {
  const wrap = document.getElementById(id);
  if (wrap) wrap.innerHTML = '<span>暂无图片</span>';
}

function showBig(imgPath, name, sku, stock) {
  const modal = document.getElementById('modal');
  document.getElementById('modalImg').src = imgPath;
  document.getElementById('modalName').textContent = name;
  document.getElementById('modalSku').textContent = '货号: ' + sku;
  const ms = document.getElementById('modalStock');
  ms.textContent = '库存: ' + stock;
  ms.style.color = stock <= 5 ? '#ff6b6b' : '#51cf66';
  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

function renderPagination() {
  const totalPages = Math.ceil(currentRenderData.length / PAGE_SIZE);
  const pag = document.getElementById('pagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }

  let html = `<button class="page-btn" ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">上一页</button>`;
  for (let i = 1; i <= totalPages; i++) {
    html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button class="page-btn" ${currentPage===totalPages?'disabled':''} onclick="goPage(${currentPage+1})">下一页</button>`;
  pag.innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

init();
</script>
</body>
</html>
