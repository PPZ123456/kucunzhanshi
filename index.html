<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棉品库存</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f5f5; color: #333; }
  
  .search-bar { position: sticky; top: 0; z-index: 100; background: #fff; padding: 10px 15px; display: flex; align-items: center; border-bottom: 1px solid #eee; }
  .search-input-wrapper { position: relative; flex: 1; }
  .search-input { width: 100%; height: 36px; border: 1px solid #ddd; border-radius: 18px; padding: 0 40px 0 15px; font-size: 14px; outline: none; background: #f9f9f9; }
  .search-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: none; background: #ff6b35; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .search-btn svg { width: 18px; height: 18px; fill: #fff; }
  .clear-x { position: absolute; right: 38px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; background: #ccc; border-radius: 50%; color: #fff; font-size: 14px; line-height: 16px; text-align: center; display: none; cursor: pointer; }
  .clear-x.show { display: block; }
  
  .header { padding: 15px; }
  .title-main { font-size: 22px; font-weight: bold; margin-top: 12px; margin-bottom: 4px; }
  .title-sub { font-size: 12px; color: #999; margin-bottom: 20px; } /* 缩小了与季节标签的间距 */
  
  .season-tabs { display: flex; gap: 8px; margin-bottom: 0px; } /* 核心修改：红框处下边距从16px降至8px */
  .season-tag { padding: 4px 12px; border-radius: 16px; font-size: 13px; border: 1px solid #ddd; background: #fff; cursor: pointer; color: #666; }
  .season-tag.active { background: #333; color: #fff; border-color: #333; }
  
  .list-container { padding: 0 15px 15px 15px; }
  .brand-card { display: flex; align-items: center; background: #eee; padding: 10px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
  .card-img { width: 42px; height: 42px; background: #ff6b35; border-radius: 6px; display: flex; align-items: center; justify-content: center; margin-right: 12px; flex-shrink: 0; overflow: hidden; padding: 10px; }
  .card-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 2px; }
  .card-title { font-size: 15px; font-weight: 500; }
</style>
</head>
<body>

<div class="search-bar">
  <div class="search-input-wrapper">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索品牌名称.." oninput="onInputChange()">
    <span class="clear-x" id="clearX" onclick="clearSearch()">×</span>
    <button class="search-btn">
      <svg viewBox="0 0 1024 1024"><path d="M974.848 975.872c-24.064 24.064-60.416 24.064-84.48 0L702.976 788.48c-163.328 120.832-387.072 114.688-538.112-24.064-169.472-157.184-181.248-435.2-17.92-604.16s435.2-175.104 604.672-6.144c151.04 151.04 163.328 386.56 36.352 549.888l187.392 187.392c24.064 24.064 24.064 59.904-0.512 84.48zM690.688 274.944c-120.832-168.96-368.64-168.96-489.984 0-78.848 102.912-78.848 253.952 0 356.352 120.832 168.96 368.64 168.96 489.984 0 78.848-108.544 78.848-253.952 0-356.352z"></path></svg>
    </button>
  </div>
</div>

<div class="header">
  <div class="title-main">棉品库存</div>
  <div class="title-sub">测试版</div>
  <div class="season-tabs">
    <div class="season-tag active" onclick="selectSeason('26秋冬', this)">26秋冬</div>
    <div class="season-tag" onclick="selectSeason('26春夏', this)">26春夏</div>
    <div class="season-tag" onclick="selectSeason('25秋冬', this)">25秋冬</div>
  </div>
</div>

<div class="list-container" id="listContainer"></div>

<script>
  const brands = [
    { name: '班纳日记26秋冬活动系列', season: '26秋冬', img: '' },
    { name: '茉纸26秋冬活动系列', season: '26秋冬', img: '' },
    { name: '小米班长26秋冬活动系列', season: '26秋冬', img: '' },
    { name: '米兰贝贝26秋冬活动系列', season: '26秋冬', img: '' },
    { name: '沐童王子26秋冬活动系列', season: '26秋冬', img: '' },
    { name: '婴装26秋冬活动系列', season: '26秋冬', img: '' },
    { name: '贝婴兔26秋冬活动系列', season: '26秋冬', img: '' },
  ];

  let currentSeason = '26秋冬';
  let currentKeyword = '';
  const coverCache = {};

  async function getBrandCover(brand) {
    if (coverCache[brand]) return coverCache[brand];
    const coverPath = `brands/${encodeURIComponent(brand)}/cover.jpg`;
    try {
      const res = await fetch(coverPath, { method: 'HEAD' });
      if (res.ok) { coverCache[brand] = coverPath; return coverPath; }
    } catch (e) {}
    try {
      const res = await fetch(`brands/${encodeURIComponent(brand)}/data.json?t=${Date.now()}`);
      if (res.ok) {
        const data = await res.json();
        const firstImg = data[0]?.['图片名'] || '';
        if (firstImg) { const imgPath = `brands/${encodeURIComponent(brand)}/${firstImg}`; coverCache[brand] = imgPath; return imgPath; }
      }
    } catch (e) {}
    coverCache[brand] = ''; return '';
  }

  async function renderList() {
    const container = document.getElementById('listContainer');
    const filtered = brands.filter(b => b.season === currentSeason && (currentKeyword === '' || b.name.includes(currentKeyword)));
    if (filtered.length === 0) { container.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">暂无数据</div>'; return; }
    
    container.innerHTML = filtered.map(b => `
      <div class="brand-card" onclick="goDetail('${b.name}')">
        <div class="card-img" id="img-${b.name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_')}"><span style="font-size:12px;color:#fff;">加载中</span></div>
        <div class="card-title">${b.name}</div>
      </div>
    `).join('');

    filtered.forEach(async (b) => {
      const cover = await getBrandCover(b.name);
      const imgDiv = document.getElementById(`img-${b.name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_')}`);
      if (imgDiv) {
        if (cover) imgDiv.innerHTML = `<img src="${cover}" onerror="this.parentElement.innerHTML='📦'">`;
        else imgDiv.innerHTML = '📦';
      }
    });
  }

  function selectSeason(season, el) {
    currentSeason = season;
    document.querySelectorAll('.season-tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderList();
  }

  function onInputChange() {
    const val = document.getElementById('searchInput').value;
    document.getElementById('clearX').classList[val ? 'add' : 'remove']('show');
    filterList();
  }

  function filterList() {
    currentKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
    renderList();
  }

  function clearSearch() {
    document.getElementById('searchInput').value = '';
    document.getElementById('clearX').classList.remove('show');
    currentKeyword = '';
    renderList();
  }

  function goDetail(brand) {
    window.location.href = `detail.html?brand=${encodeURIComponent(brand)}`;
  }

  renderList();
</script>
</body>
</html>
