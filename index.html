<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>库存展示</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
  .header { text-align: center; margin-bottom: 24px; }
  .header h2 { margin: 0; font-size: 24px; color: #333; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; max-width: 1400px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .img-wrap { width: 100%; height: 280px; background: #e0e0e0; display: flex; align-items: center; justify-content: center; color: #999; position: relative; }
  .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  .card-info { padding: 12px 16px; }
  .name { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 8px; word-break: break-all; }
  .detail { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .sku { color: #666; }
  .stock { font-weight: bold; }
  .stock.ok { color: #2ea660; }
  .stock.low { color: #e74c3c; }
  .loading { text-align: center; padding: 40px; color: #999; font-size: 16px; }

  /* 大图弹窗 */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; }
  .modal.active { display: flex; }
  .modal-img-wrap { position: relative; max-width: 90%; max-height: 75%; display: flex; justify-content: center; align-items: center; }
  .modal img { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
  .modal-info { margin-top: 16px; text-align: center; color: #fff; padding: 0 20px; }
  .modal-info .modal-name { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
  .modal-info .modal-detail { font-size: 16px; opacity: 0.9; }
  .modal-info .modal-detail .modal-sku { margin-right: 24px; }
  .modal-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 36px; cursor: pointer; opacity: 0.7; transition: opacity 0.2s; }
  .modal-close:hover { opacity: 1; }
</style>
</head>
<body>
<div class="header">
  <h2>📦 库存展示</h2>
</div>
<div class="loading" id="loading">正在加载数据...</div>
<div class="grid" id="grid"></div>

<div class="modal" id="modal" onclick="closeModal()">
  <div class="modal-close" onclick="closeModal()">&times;</div>
  <div class="modal-img-wrap" onclick="event.stopPropagation()">
    <img id="modalImg" src="">
  </div>
  <div class="modal-info" id="modalInfo">
    <div class="modal-name" id="modalName"></div>
    <div class="modal-detail">
      <span class="modal-sku" id="modalSku"></span>
      <span class="modal-stock" id="modalStock"></span>
    </div>
  </div>
</div>

<script>
const grid = document.getElementById('grid');
const loading = document.getElementById('loading');

// 页面加载时自动读取 data.json
fetch('data.json')
  .then(res => {
    if (!res.ok) throw new Error('找不到 data.json 文件');
    return res.json();
  })
  .then(data => {
    loading.style.display = 'none';
    renderCards(data);
  })
  .catch(err => {
    loading.textContent = '加载失败：' + err.message + '。请确保 data.json 文件与网页在同一文件夹。';
    console.error(err);
  });

function renderCards(data) {
  // data 应该是数组格式：[{货号, 商品名称, 图片名, 库存}, ...]
  // 自动识别字段名（兼容不同列名）
  if (data.length === 0) return;
  
  const firstRow = data[0];
  const keys = Object.keys(firstRow);
  let nameKey = keys.find(k => k.includes('名称') || k.includes('商品')) || keys[1];
  let skuKey = keys.find(k => k.includes('货号') || k.includes('SKU')) || keys[0];
  let stockKey = keys.find(k => k.includes('库存') || k.includes('数量')) || keys[keys.length - 1];
  let imgKey = keys.find(k => k.includes('图片名') || k.includes('图片')) || null;
  
  grid.innerHTML = '';
  data.forEach((row, index) => {
    const name = row[nameKey] || row[skuKey];
    const sku = row[skuKey];
    const stock = row[stockKey];
    const imgName = imgKey ? row[imgKey] : null;
    if (!sku) return;
    
    const baseName = imgName ? imgName.replace(/\.(jpg|png|jpeg)$/i, '') : sku;
    const wrapId = 'wrap-' + index;
    const safeName = (name || '').toString().replace(/'/g, "\\'");
    const safeSku = (sku || '').toString().replace(/'/g, "\\'");
    
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="img-wrap" id="${wrapId}">
        <img src="${baseName}.jpg" 
             onclick="showBig('${baseName}.jpg','${baseName}.png','${safeName}','${safeSku}',${stock})" 
             onerror="this.onerror=function(){handleImgErr('${wrapId}')}; this.src='${baseName}.png';">
      </div>
      <div class="card-info">
        <div class="name">${name}</div>
        <div class="detail">
          <span class="sku">${sku}</span>
          <span class="stock ${stock > 5 ? 'ok' : 'low'}">库存: ${stock}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function handleImgErr(id) {
  const wrap = document.getElementById(id);
  if (wrap) wrap.innerHTML = '<span>暂无图片</span>';
}

function showBig(jpg, png, name, sku, stock) {
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modalImg');
  const modalName = document.getElementById('modalName');
  const modalSku = document.getElementById('modalSku');
  const modalStock = document.getElementById('modalStock');
  
  modalImg.src = jpg;
  modalImg.onerror = function() { this.src = png; };
  
  modalName.textContent = name;
  modalSku.textContent = '货号: ' + sku;
  modalStock.textContent = '库存: ' + stock;
  if (stock <= 5) modalStock.style.color = '#ff6b6b';
  else modalStock.style.color = '#51cf66';
  
  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
