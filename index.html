<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棉品库存（测试版）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
  
  .header { text-align: center; margin-bottom: 16px; }
  .header h2 { font-size: 24px; color: #333; }
  
  /* ===== 紧凑胶囊标签 ===== */
  .filter-bar { 
    display: flex; 
    flex-wrap: wrap; 
    gap: 4px; 
    justify-content: center; 
    margin-bottom: 12px; 
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
  }
  .filter-btn { 
    padding: 5px 14px; 
    border: 1px solid #2ea660; 
    background: #fff; 
    color: #2ea660; 
    border-radius: 16px; 
    cursor: pointer; 
    font-size: 13px; 
    font-weight: 500;
    transition: all 0.2s; 
    white-space: nowrap;
  }
  .filter-btn.active { 
    background: #2ea660; 
    color: #fff; 
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(46,166,96,0.3);
  }
  .filter-btn:hover:not(.active) { 
    background: #e8f8ef; 
    border-color: #279155;
  }
  
  /* ===== 搜索栏冻结（sticky）+ 手机端一行 ===== */
  .search-sticky {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(245, 245, 245, 0.95);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 10px 0 12px;
    margin-bottom: 4px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .search-bar { 
    display: flex; 
    align-items: center; 
    gap: 6px; 
    flex-wrap: nowrap;          /* 强制不换行 */
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 12px;           /* 左右留安全边距 */
  }
  .search-bar input { 
    flex: 1;                   /* 占满剩余空间 */
    min-width: 0;              /* 允许收缩到比内容更小 */
    padding: 9px 14px; 
    font-size: 14px; 
    border: 1px solid #ddd; 
    border-radius: 20px; 
    outline: none; 
    box-shadow: 0 1px 4px rgba(0,0,0,0.06); 
    transition: border-color 0.2s, box-shadow 0.2s; 
  }
  .search-bar input:focus { 
    border-color: #2ea660; 
    box-shadow: 0 2px 8px rgba(46,166,96,0.2); 
  }
  .search-bar .clear-btn { 
    flex-shrink: 0;            /* 按钮不压缩，保持原尺寸 */
    padding: 7px 14px; 
    border: 1px solid #ccc; 
    background: #fff; 
    color: #666; 
    border-radius: 20px; 
    cursor: pointer; 
    font-size: 13px; 
    transition: all 0.2s; 
    white-space: nowrap;
  }
  .search-bar .clear-btn:hover { 
    background: #ff6b6b; 
    color: #fff; 
    border-color: #ff6b6b; 
  }
  
  /* 每页数量选择器 */
  .page-size-bar { text-align: center; margin-bottom: 16px; font-size: 13px; color: #666; }
  .page-size-bar select { padding: 4px 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; margin-left: 4px; cursor: pointer; }
  
  .search-result-hint { text-align: center; color: #999; font-size: 13px; margin-bottom: 12px; }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
  .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s; }
  .card:hover { transform: translateY(-4px); }
  .img-wrap { width: 100%; height: 220px; background: #eee; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .img-wrap img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
  .img-wrap span { color: #999; font-size: 14px; }
  .card-info { padding: 12px; }
  .name { font-weight: bold; font-size: 15px; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .sku { color: #666; }
  
  .color-box { margin: 8px 0 4px; font-size: 13px; color: #444; line-height: 1.8; }
  .color-item { display: inline-block; margin-right: 2px; }
  .color-item b.ok { color: #2ea660; font-weight: normal; }
  .color-item b.low { color: #ff6b6b; font-weight: bold; }
  .color-item.zero { color: #bbb; text-decoration: line-through; }
  
  .special-price { display: block; color: #e74c3c; font-weight: bold; font-size: 14px; margin-top: 6px; text-align: right; }
  
  .pagination { text-align: center; margin-top: 24px; }
  .page-btn { padding: 6px 12px; margin: 0 4px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; }
  .page-btn.active { background: #2ea660; color: #fff; border-color: #2ea660; }
  .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .loading { text-align: center; padding: 40px; color: #999; }
  
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
  .modal.active { display: flex; }
  .modal img { max-width: 90%; max-height: 75vh; object-fit: contain; border-radius: 8px; cursor: default; }
  .modal-info { color: #fff; margin-top: 16px; text-align: center; font-size: 16px; }
  .modal-info div { margin: 4px 0; }
  .modal-stock { font-weight: bold; }
  .close-btn { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 36px; cursor: pointer; opacity: 0.7; }
  .close-btn:hover { opacity: 1; }
  
  .no-result { text-align: center; padding: 60px 20px; color: #999; font-size: 16px; }
  
  .stats-bar { text-align: center; color: #999; font-size: 12px; margin-bottom: 12px; }

  /* 手机端额外收紧 */
  @media (max-width: 480px) {
    body { padding: 12px 8px; }
    .header h2 { font-size: 20px; }
    .search-bar { padding: 0 8px; gap: 4px; }
    .search-bar input { padding: 8px 12px; font-size: 13px; }
    .search-bar .clear-btn { padding: 6px 10px; font-size: 12px; }
    .filter-btn { padding: 4px 10px; font-size: 12px; }
    .page-size-bar { font-size: 12px; }
    .page-size-bar select { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <h2>📦 棉品库存（测试版）</h2>
</div>

<div class="filter-bar" id="filterBar"></div>

<!-- 搜索栏（冻结吸顶，手机端一行） -->
<div class="search-sticky">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索货号或商品名称..." oninput="filterCards()" />
    <button class="clear-btn" onclick="clearSearch()">清除</button>
  </div>
  <div class="search-result-hint" id="searchHint"></div>
</div>

<!-- 每页数量选择 -->
<div class="page-size-bar">
  每页显示：
  <select id="pageSizeSelect" onchange="changePageSize()">
    <option value="12">12 个款</option>
    <option value="24" selected>24 个款</option>
    <option value="36">36 个款</option>
    <option value="48">48 个款</option>
  </select>
  <span id="statsBar" class="stats-bar"></span>
</div>

<div class="loading" id="loading">加载中...</div>
<div class="grid" id="grid"></div>
<div class="pagination" id="pagination"></div>

<div class="modal" id="modal" onclick="closeModal()">
  <span class="close-btn" onclick="closeModal()">&times;</span>
  <img id="modalImg" src="" onclick="event.stopPropagation()">
  <div class="modal-info">
    <div id="modalName"></div>
    <div id="modalSku"></div>
    <div id="modalStock" class="modal-stock"></div>
    <div id="modalPrice" class="modal-stock" style="display:none;"></div>
  </div>
</div>

<script>
// ================= 配置区 =================
const brands = ['茉纸26秋冬', '兰朵儿26秋冬', '洹乐熊26秋冬', '钓鱼猫26秋冬', '贝婴兔26秋冬', '班纳日记26秋冬', '婴装26秋冬', '叮当町26秋冬', '小米班长26秋冬', '青禾小筑26秋冬', '丛林木马26秋冬', '米兰贝贝26秋冬', '椰奶小贝26秋冬', '沐童王子26秋冬', '英贝米尼26秋季', '贝肽斯26秋冬', '贝婴兔福利款'];
// =================

let PAGE_SIZE = 24;
let currentBrand = 'all';
let allDataCache = [];
let currentRenderData = [];
let currentPage = 1;
let searchKeyword = '';

function init() {
  renderFilterButtons();
  loadBrand('all');
}

function renderFilterButtons() {
  const bar = document.getElementById('filterBar');
  let html = `<button class="filter-btn active" onclick="loadBrand('all', this)">全部</button>`;
  brands.forEach(b => {
    const safeB = b.replace(/'/g, "\\'");
    html += `<button class="filter-btn" onclick="loadBrand('${safeB}', this)">${b}</button>`;
  });
  bar.innerHTML = html;
}

function changePageSize() {
  const select = document.getElementById('pageSizeSelect');
  PAGE_SIZE = parseInt(select.value);
  currentPage = 1;
  renderPage();
}

function loadBrand(brand, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  
  currentBrand = brand;
  currentPage = 1;
  searchKeyword = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchHint').textContent = '';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('grid').innerHTML = '';

  if (brand === 'all') {
    Promise.all(brands.map(b => 
      fetch(`brands/${encodeURIComponent(b)}/data.json?t=${Date.now()}`)
        .then(res => {
          if (!res.ok) throw new Error(`品牌"${b}"加载失败`);
          return res.json();
        })
        .then(data => data.map(row => ({...row, _brand: b})))
        .catch(err => {
          console.error(err.message);
          return [];
        })
    )).then(results => {
      allDataCache = results.flat();
      currentRenderData = allDataCache;
      document.getElementById('loading').style.display = 'none';
      
      const skuCount = new Set(allDataCache.map(r => r['货号'])).size;
      document.getElementById('statsBar').textContent = `共 ${allDataCache.length} 行数据，${skuCount} 个款`;
      
      renderPage();
    });
  } else {
    fetch(`brands/${encodeURIComponent(brand)}/data.json?t=${Date.now()}`)
      .then(res => {
        if (!res.ok) throw new Error('找不到 data.json');
        return res.json();
      })
      .then(data => {
        allDataCache = data.map(row => ({...row, _brand: brand}));
        currentRenderData = allDataCache;
        document.getElementById('loading').style.display = 'none';
        
        const skuCount = new Set(allDataCache.map(r => r['货号'])).size;
        document.getElementById('statsBar').textContent = `共 ${allDataCache.length} 行数据，${skuCount} 个款`;
        
        renderPage();
      })
      .catch(err => {
        document.getElementById('loading').textContent = '加载失败：' + err.message;
      });
  }
}

// ========== 搜索功能 ==========
function filterCards() {
  const input = document.getElementById('searchInput');
  searchKeyword = input.value.trim().toLowerCase();
  
  if (!searchKeyword) {
    currentRenderData = allDataCache;
    currentPage = 1;
    document.getElementById('searchHint').textContent = '';
    renderPage();
    return;
  }
  
  currentRenderData = allDataCache.filter(row => {
    const name = (row['商品名称'] || row['name'] || '').toString().toLowerCase();
    const sku = (row['货号'] || row['sku'] || '').toString().toLowerCase();
    return name.includes(searchKeyword) || sku.includes(searchKeyword);
  });
  
  currentPage = 1;
  
  const hint = document.getElementById('searchHint');
  if (currentRenderData.length === 0) {
    hint.textContent = `未找到包含"${input.value}"的商品`;
  } else {
    const skuCount = new Set(currentRenderData.map(r => r['货号'])).size;
    hint.textContent = `找到 ${currentRenderData.length} 行数据，${skuCount} 个款`;
  }
  
  renderPage();
}

function clearSearch() {
  searchKeyword = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchHint').textContent = '';
  currentRenderData = allDataCache;
  currentPage = 1;
  renderPage();
}

document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        filterCards();
      }
    });
  }
});

// ========== 核心：按货号合并 + 颜色标签渲染 ==========
function renderPage() {
  const grid = document.getElementById('grid');
  
  const grouped = {};
  currentRenderData.forEach(row => {
    const sku = row['货号'] || row['sku'] || '未知货号';
    if (!grouped[sku]) grouped[sku] = [];
    grouped[sku].push(row);
  });

  const skuList = Object.keys(grouped);
  const start = (currentPage - 1) * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  const pageSkus = skuList.slice(start, end);

  if (pageSkus.length === 0) {
    grid.innerHTML = '<div class="no-result">暂无匹配商品</div>';
    renderPagination(skuList.length);
    return;
  }

  grid.innerHTML = pageSkus.map((sku, index) => {
    const items = grouped[sku];
    const main = items[0];
    const name = main['商品名称'] || main['name'] || sku;
    const imgName = main['图片名'] || main['image'] || '';
    const brand = main._brand || currentBrand;
    const imgPath = `brands/${brand}/${imgName}`;
    const specialPrice = main['特供价'] || main['特价'] || '';
    
    const colorDetails = items.map(c => {
      const cName = c['颜色'] || '默认';
      const cStock = parseInt(c['库存']) || 0;
      const stockClass = cStock <= 5 ? 'low' : 'ok';
      const zeroClass = cStock === 0 ? 'zero' : '';
      return `<span class="color-item ${zeroClass}">${cName}:<b class="${stockClass}">${cStock}</b></span>`;
    }).join(' &nbsp;|&nbsp; ');

    const priceHtml = specialPrice ? `<span class="special-price">特供价: ¥${specialPrice}</span>` : '';
    const wrapId = 'wrap-' + (start + index);
    const safeName = name.replace(/'/g, "\\'");
    const safeSku = sku.replace(/'/g, "\\'");
    const safePrice = (specialPrice || '').toString().replace(/'/g, "\\'");
    
    const modalColors = items.map(c => `${c['颜色']||'默认'}:${c['库存']||0}`).join(' | ');

    return `
      <div class="card">
        <div class="img-wrap" id="${wrapId}">
          <img src="${imgPath}" 
               onclick="showBig('${imgPath.replace(/'/g,"\\'")}','${safeName}','${safeSku}','${modalColors}','${safePrice}')" 
               onerror="this.onerror=function(){handleImgErr('${wrapId}')};">
        </div>
        <div class="card-info">
          <div class="name">${name}</div>
          <div class="detail">
            <span class="sku">${sku}</span>
          </div>
          <div class="color-box">${colorDetails}</div>
          ${priceHtml}
        </div>
      </div>
    `;
  }).join('');

  renderPagination(skuList.length);
}

function handleImgErr(id) {
  const wrap = document.getElementById(id);
  if (wrap) wrap.innerHTML = '<span>暂无图片</span>';
}

function showBig(imgPath, name, sku, colorInfo, specialPrice) {
  const modal = document.getElementById('modal');
  document.getElementById('modalImg').src = imgPath;
  document.getElementById('modalName').textContent = name;
  document.getElementById('modalSku').textContent = `货号: ${sku}  |  ${colorInfo}`;
  
  const ms = document.getElementById('modalStock');
  ms.style.display = 'none';
  
  const priceDiv = document.getElementById('modalPrice');
  if (specialPrice) {
    priceDiv.textContent = '特供价: ¥' + specialPrice;
    priceDiv.style.color = '#e74c3c';
    priceDiv.style.display = 'block';
  } else {
    priceDiv.style.display = 'none';
  }
  
  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

function renderPagination(totalItems) {
  const totalPages = Math.ceil(totalItems / PAGE_SIZE);
  const pag = document.getElementById('pagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }

  let html = `<button class="page-btn" ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">上一页</button>`;
  
  const maxButtons = 10;
  let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
  let endPage = Math.min(totalPages, startPage + maxButtons - 1);
  if (endPage - startPage < maxButtons - 1) {
    startPage = Math.max(1, endPage - maxButtons + 1);
  }
  
  if (startPage > 1) {
    html += `<button class="page-btn" onclick="goPage(1)">1</button>`;
    if (startPage > 2) html += `<span style="margin:0 4px;">...</span>`;
  }
  
  for (let i = startPage; i <= endPage; i++) {
    html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  
  if (endPage < totalPages) {
    if (endPage < totalPages - 1) html += `<span style="margin:0 4px;">...</span>`;
    html += `<button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`;
  }
  
  html += `<button class="page-btn" ${currentPage===totalPages?'disabled':''} onclick="goPage(${currentPage+1})">下一页</button>`;
  pag.innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

init();
</script>
</body>
</html>
