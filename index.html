<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棉品库存 - 测试版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; color: #3f3f3f; }
  
  /* 搜索栏吸顶 & 一行显示 */
  .search-sticky {
    position: sticky; top: 0; z-index: 100;
    background: rgba(245,245,245,0.95); backdrop-filter: blur(8px);
    padding: 10px 12px; border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .search-bar { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
  .search-input-wrapper { flex: 1; min-width: 0; position: relative; }
  .search-input-wrapper input {
    width: 100%; padding: 9px 40px 9px 14px; border: 1px solid #ddd;
    border-radius: 20px; outline: none; font-size: 14px;
  }
  .search-btn {
    position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border: none; border-radius: 50%;
    background: #fd705f; color: #fff; cursor: pointer; display: flex;
    align-items: center; justify-content: center; font-size: 14px;
  }
  .clear-btn {
    flex-shrink: 0; padding: 7px 12px; border: 1px solid #ccc;
    background: #fff; color: #666; border-radius: 20px; cursor: pointer; font-size: 13px;
  }

  /* 标题区 */
  .header { text-align: center; margin: 20px 0 12px; }
  .title-main { font-size: 28px; font-weight: 800; color: #3f3f3f; }
  .title-sub { font-size: 14px; color: #3f3f3f; margin-top: 4px; }

  /* 季节标签 */
  .tags-bar { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .season-tag {
    padding: 5px 14px; border: 1px solid #3f3f3f; border-radius: 16px;
    font-size: 13px; color: #3f3f3f; background: #fff; cursor: pointer;
  }
  .season-tag.active { background: #3f3f3f; color: #fff; }

  /* 列表卡片 */
  .list-container { padding: 0 12px 24px; max-width: 600px; margin: 0 auto; }
  .brand-card {
    display: flex; align-items: center; gap: 12px; background: #ebebeb;
    padding: 10px; border-radius: 10px; margin-bottom: 10px; cursor: pointer;
    transition: transform 0.1s;
  }
  .brand-card:active { transform: scale(0.98); }
  .card-img {
    width: 60px; height: 60px; background: #fd705f; border-radius: 8px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; overflow: hidden;
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card-title { font-size: 15px; font-weight: 600; color: #3f3f3f; }

  @media (max-width: 480px) {
    .title-main { font-size: 24px; }
    .card-img { width: 52px; height: 52px; }
  }
</style>
</head>
<body>

<div class="search-sticky">
  <div class="search-bar">
    <div class="search-input-wrapper">
      <input type="text" id="searchInput" placeholder="搜索品牌名称..." oninput="filterList()">
      <button class="search-btn" onclick="filterList()">🔍</button>
    </div>
    <button class="clear-btn" onclick="clearSearch()">清除</button>
  </div>
</div>

<div class="header">
  <div class="title-main">棉品库存</div>
  <div class="title-sub">测试版</div>
</div>

<div class="tags-bar">
  <div class="season-tag active" onclick="selectSeason('26秋冬', this)">26秋冬</div>
  <div class="season-tag" onclick="selectSeason('26春夏', this)">26春夏</div>
  <div class="season-tag" onclick="selectSeason('25秋冬', this)">25秋冬</div>
</div>

<div class="list-container" id="listContainer"></div>

<script>
  // 品牌列表（img 留空则自动尝试 cover.jpg，找不到再兜底用 data.json 第一张图）
  const brands = [
    { name: '班纳日记26秋冬活动系列', season: '26秋冬', img: '' },
    { name: '茉纸26秋冬活动系列', season: '26秋冬', img: '' },
    { name: '小米班长26秋冬活动系列', season: '26秋冬', img: '' },
    { name: '洹乐熊26秋冬活动系列', season: '26秋冬', img: '' },
    { name: '米兰贝贝26秋冬活动系列', season: '26秋冬', img: '' },
    { name: '沐童王子26秋冬活动系列', season: '26秋冬', img: '' },
    { name: '婴装26秋冬活动系列', season: '26秋冬', img: '' },
    { name: '贝婴兔26秋冬活动系列', season: '26秋冬', img: '' },
  ];

  let currentSeason = '26秋冬';
  let currentKeyword = '';

  // 品牌封面缓存（避免重复 fetch）
  const coverCache = {};

  async function getBrandCover(brand) {
    if (coverCache[brand]) return coverCache[brand];

    // 1. 先尝试 cover.jpg
    const coverPath = `brands/${encodeURIComponent(brand)}/cover.jpg`;
    try {
      const res = await fetch(coverPath, { method: 'HEAD' });
      if (res.ok) {
        coverCache[brand] = coverPath;
        return coverPath;
      }
    } catch (e) {}

    // 2. 兜底：fetch data.json 拿第一张商品图
    try {
      const res = await fetch(`brands/${encodeURIComponent(brand)}/data.json?t=${Date.now()}`);
      if (res.ok) {
        const data = await res.json();
        const firstImg = data[0]?.['图片名'] || '';
        if (firstImg) {
          const imgPath = `brands/${encodeURIComponent(brand)}/${firstImg}`;
          coverCache[brand] = imgPath;
          return imgPath;
        }
      }
    } catch (e) {}

    coverCache[brand] = '';
    return '';
  }

  async function renderList() {
    const container = document.getElementById('listContainer');
    const filtered = brands.filter(b => 
      b.season === currentSeason && (currentKeyword === '' || b.name.includes(currentKeyword))
    );

    if (filtered.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">暂无数据</div>';
      return;
    }

    // 先渲染骨架（文字部分）
    container.innerHTML = filtered.map(b => `
      <div class="brand-card" onclick="goDetail('${b.name}')">
        <div class="card-img" id="img-${b.name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_')}">
          <span style="font-size:12px;color:#fff;">加载中</span>
        </div>
        <div class="card-title">${b.name}</div>
      </div>
    `).join('');

    // 异步加载封面图
    filtered.forEach(async (b) => {
      const cover = await getBrandCover(b.name);
      const imgDiv = document.getElementById(`img-${b.name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_')}`);
      if (imgDiv) {
        if (cover) {
          imgDiv.innerHTML = `<img src="${cover}" onerror="this.parentElement.innerHTML='📦'">`;
        } else {
          imgDiv.innerHTML = '📦';
        }
      }
    });
  }

  function selectSeason(season, el) {
    currentSeason = season;
    document.querySelectorAll('.season-tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderList();
  }

  function filterList() {
    currentKeyword = document.getElementById('searchInput').value.trim();
    renderList();
  }

  function clearSearch() {
    document.getElementById('searchInput').value = '';
    currentKeyword = '';
    renderList();
  }

  function goDetail(brand) {
    window.location.href = `detail.html?brand=${encodeURIComponent(brand)}`;
  }

  renderList();
</script>
</body>
</html>
